<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBSE Science fair 2026-Register</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: #41b883;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 18px;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .container {
      width: 80%;
      max-width: 650%;
      margin: 30px auto;
      padding: 25px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #ffffff;
    }

    H2 {
      color: #2c3e50;
    }

    /* Form Styling (week 3 & 4) */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #2c3e50;
    }

    input[type="text"] input[type="email"] select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      /* Includes padding in width */
      font-size: 14px;
    }

    .submit-btn {
      background-color: #41b883;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: #34976d;
    }

    /* Resource Links List (week2) */
    ul {
      background-color: #34976d;
      padding: 15px 30px;
      border-radius: 8px;
    }

    ul li {
      margin-bottom: 8px;
    }

    ul a {
      color: #2c3e50;
      font-weight: bold;
      text-decoration: none;
    }

    ul a:hover {
      color: #2c3e50;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!--Header Navigation-->
  <header>
    <h1>Project Registration Portal</h1>
    <nav>
      <a href="Index.html">Home</a>
      <a href="Register.html">Register Project</a>
    </nav>
  </header>
  <div class="container">
    <h2>Register Your Team</h2>
    <p>Fill out the form below to register your team for the Science Fair.</p>

    <!--Form Elements (Week 3)-->
    <form>
      <div class="form-group">
        <label for="studentName">Student Leader Name:</label>
        <input type="text" id="studentName" name="studentName" placeholder="e.g., Aarav Sharma" required>
      </div>

      <div class="form-group">
        <label for="classGrade">Select Class:</label>
        <select id="classGrade" name="classGrade">
          <option value="5">Class 5</option>
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>

        </select>
      </div>

      <div class="form-group">
        <label for="category">ProjectCategory:</label>
        <select id="category" name="ProjectCategory">
          <option value="robotics">Robotics & Tech</option>
          <option value="energy">Green Energy </option>
          <option value="space">Space Exploration </option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Project Summary:</label>
        <textarea id="description" name="projectDescription" rows="4"
          placeholder="Briefly descibe your science projct madel..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Registration</button>
    </form>

    <hr style="margin: 30px 0;">

    <!--Useful External Study Links (Week 2-Hyperlinks)-->
    <h2>Helpful Research Portals</h2>
    <p>Need inspiration for your project? Check these links:</p>
    <ul>
      <li><a href="https://kids.nationalgeographic.com" target="_blank">National Gegraphic Kids</a></li>
      <li><a href="https://www.nasa-kids-club/" target="_blank">NASA kids' Club</a></li>
      <li><a href="https://ncert.nic.in" target="_blank" NCERT Science Resource</a></li>

    </ul>
  </div>
</body>

</html>
